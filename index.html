<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="weather.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/boxicons@latest/css/boxicons.min.css">
</head>
<body>
    <p id="information">Press Enter for a new search</p>

    <main id="search-container">
        <section id="glass" aria-label="Weather search">
            <form id="search-form">
                <label class="sr-only" for="search-zone">City</label>
                <input id="search-zone" type="search" placeholder="Enter a city!" spellcheck="false" autocomplete="off">
                <button id="search" type="submit" aria-label="Search">
                    <i class="bx bx-search" aria-hidden="true"></i>
                </button>
            </form>

            <div id="weather" aria-live="polite">
                <h1 id="error" role="alert"></h1>
                <img src="images/props/clouds.png" id="image" class="weather-icon" alt="">
                <h1 class="temp"></h1>
                <h2 class="city"></h2>
                <div class="details" id="details">
                    <div id="humidity">
                        <h2>Humidity</h2>
                        <h3 id="humiditylvl"></h3>
                    </div>
                    <div id="wind">
                        <h2>Wind Speed</h2>
                        <h3 id="windspeed"></h3>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="weather.js"></script>
</body>
</html>
